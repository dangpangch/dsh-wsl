# dsh-wsl bundle layer — applied after the base and web-app bundles.
#
# This is a WHOLE-PROFILE switch: `fs` and `subprocess` are host-plane services (one
# implementation per composition), so enabling WSL means replacing the local providers
# rather than routing around them. A second provider cannot simply take the slot —
# Cordis refuses it and the local row keeps working — so the replaced rows are disabled
# here and the WSL rows are inserted in their place.
#
# Rows disabled, and why:
#   fs-local        provides `ctx.fs`          — replaced by the WSL filesystem
#   fs-sandbox      extends fs-local, so it cannot survive fs-local's removal; file-effect
#                   policy on WSL paths is enforced by the WSL sandbox instead
#   subprocess      provides `ctx.subprocess`  — replaced by the WSL subprocess provider
#   sandbox-local   provides `ctx.sandbox`     — the host process sandbox cannot confine
#                   processes that run inside the distribution; the WSL provider wraps
#                   confined argv with the distribution's own bubblewrap backend instead
#
# Sandbox note: since M5b the WSL plugin provides `ctx.sandbox` itself. Confined argv
# runs under a deployed bubblewrap with the same profile dialect `sandbox-local` speaks
# on Linux, so mode IS enforced for processes inside the distribution, and `full`
# enforcement is reported rather than implied. A backend that cannot start fails closed
# with SANDBOX_UNAVAILABLE; mode is never reported-but-ignored.

- id: include:fs-local
  disabled: true

- id: include:fs-sandbox
  disabled: true

- id: include:subprocess
  disabled: true

- id: include:sandbox-local
  disabled: true

- insert:
    - id: wsl
      name: '@local/dsh-wsl'
      config:
        distro: ''
        runtimeStrategy: push
